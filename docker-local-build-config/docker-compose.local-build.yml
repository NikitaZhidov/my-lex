services:
  db:
    container_name: my-lex-app-dev-postgres
    image: postgres:17.7
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - my-lex-app-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 2s
      retries: 20

  redis:
    container_name: my-lex-app-dev-redis
    image: redis:8.6
    restart: always
    ports:
      - 6379:6379
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - my-lex-app-dev

  api:
    container_name: my-lex-app-dev-api
    build:
      context: ..
      dockerfile: ./apps/api/Dockerfile
    ports:
      - '3001:3001'
    networks:
      - my-lex-app-dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      - API_PORT=3001

      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_URL=redis://default:${REDIS_PASSWORD}@redis:6379

      - API_BASE_URL=http://localhost:3001/api
      - WEB_APP_BASE_URL=http://localhost:3000

      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}

      - COOKIE_SECRET=${COOKIE_SECRET}
      - SESSION_NAME=${SESSION_NAME}
      - SESSION_SECRET=${SESSION_SECRET}
      - SESSION_DOMAIN=${SESSION_DOMAIN}
      - SESSION_MAX_AGE=${SESSION_MAX_AGE}
      - SESSION_HTTP_ONLY=${SESSION_HTTP_ONLY}
      - SESSION_SECURE=${SESSION_SECURE}
      - SESSION_FOLDER=${SESSION_FOLDER}

      - AI_PROVIDER=${AI_PROVIDER}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY}

  web:
    container_name: my-lex-app-dev-web
    build:
      context: ..
      dockerfile: ./apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api
    ports:
      - '3000:3000'
    networks:
      - my-lex-app-dev
    depends_on:
      api:
        condition: service_started
    environment:
      - API_INTERNAL_BASE_URL=http://api:3001/api


volumes:
  postgres_data:
  redis_data:

networks:
  my-lex-app-dev:
