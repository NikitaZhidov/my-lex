services:
  db:
    container_name: postgres
    image: postgres:17.7
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - my-lex-app

  redis:
    container_name: redix
    image: redis:8.6
    restart: always
    ports:
      - 6379:6379
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - my-lex-app

volumes:
  postgres_data:
  redis_data:

networks:
  my-lex-app:
