name: PR workflow
run-name: PR CI

on:
  pull_request:
    branches:
      - master

jobs:
  build-test-lint:
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      actions: 'read'
      pull-requests: 'read'

    steps:
      - uses: actions/checkout@v5
        with:
          # We need to fetch all branches and commits so that Nx affected has a base to compare against.
          fetch-depth: 0
          filter: tree:0 # Optional, but recommended: reduce the size of the checkout with tree filtering

      - name: Use node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - run: npm ci
      - uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: 'master'

      - run: |
          echo "BASE: ${{ env.NX_BASE }}"
          echo "HEAD: ${{ env.NX_HEAD }}"

      - run: npm run db-generate
      - run: npx nx affected -t lint test build

  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - run: npm ci

      - run: npm run db-generate

      - name: Prepare .env files
        run: |
          cp ./.env.e2e ./.env
          cp ./apps/api/.env.e2e ./apps/api/.env
          cp ./apps/web/.env.e2e ./apps/web/.env
          cp ./apps/web-e2e/.env.template ./apps/web-e2e/.env
          cp ./apps/api-e2e/.env.template ./apps/api-e2e/.env

      - name: Run databases
        run: docker compose -f docker-compose.e2e.yml up --wait --wait-timeout 30

      - run: npm run e2e:db-deploy

      - run: npm run e2e:api-ci
      - run: npm run e2e:web-ci
